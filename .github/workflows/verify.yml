name: Verify Java and website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: corretto
          java-version: '17'
          settings-path: ${{ runner.temp }}/turboj-publishing-settings
      - name: Retain actual project toolchain
        run: echo "TURBOJ_TEST_JDK17=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          settings-path: ${{ runner.temp }}/turboj-publishing-settings
      # The wrapper uses .cache/m2, not setup-java's default ~/.m2 repository.
      # Keep acquisition explicit until a cache for the project paths is configured.
      - name: Capture build inputs
        run: python3 scripts/build-receipt.py begin
      - name: Verify build receipt guards
        run: python3 scripts/test-build-receipt.py
      - name: Build and test complete reactor (macOS)
        if: runner.os == 'macOS'
        run: ./mvnw --batch-mode --no-transfer-progress -Dturboj.test.mavenOffline=false clean install
      - name: Build and test complete reactor (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./mvnw --batch-mode --no-transfer-progress -Dturboj.test.mavenOffline=false clean install
      - name: Verify standalone ecosystem build entry points
        run: |
          for module in commandj refactorj mavenj turbotest turbo-ai javafmt; do
            ./mvnw --batch-mode --no-transfer-progress -f "$module/pom.xml" -DskipTests verify
          done
      - name: Real Swing command effects and JUnit output (Linux virtual display)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          mkdir -p app/target/ci-native
          java_options=(--enable-native-access=ALL-UNNAMED -Djava.awt.headless=false)
          for package in api code file parser tree util; do
            java_options+=("--add-exports=jdk.compiler/com.sun.tools.javac.$package=ALL-UNNAMED")
          done
          for check in QuickFixPopupSmoke TestOutputSmoke; do
            timeout --kill-after=10s 210s xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' \
              java "${java_options[@]}" -cp app/target/test-classes:app/target/turboj-app.jar \
              "dev.turboj.app.$check" > "app/target/ci-native/$check.txt" 2>&1
          done
      - name: Capture exact build identity
        run: python3 scripts/build-receipt.py create
      - name: Ad-hoc signed local macOS app and DMG with bundled runtime
        if: runner.os == 'macOS'
        env:
          TURBOJ_SKIP_BUILD: '1'
        run: ./scripts/package-macos.sh dmg target/ci-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        timeout-minutes: 5
        with:
          name: java-evidence-${{ matrix.os }}
          # Bound report discovery to reactor module depths. A recursive ** glob
          # follows DMG staging's Applications symlink outside the checkout.
          path: |
            */target/surefire-reports/*.xml
            */*/target/surefire-reports/*.xml
            */target/failsafe-reports/*.xml
            */*/target/failsafe-reports/*.xml
            app/target/build-receipt.json
            app/target/ci-native/
            app/target/test-output-smoke/
            target/maven-toolchain17-qualification.txt
            target/maven-explicit-lifecycle-qualification.txt
            target/ci-package/TurboJ.app/Contents/Resources/build-receipt.json
            target/ci-package/TurboJ.package-receipt.json
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Install pinned Playwright browser
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "playwright"; import { accessSync, constants } from "node:fs"; const executable = chromium.executablePath(); accessSync(executable, constants.X_OK); console.log(`CHROME_PATH=${executable}`);' >> "$GITHUB_ENV"
      - name: Browser, keyboard and accessibility regressions
        env:
          QA_BASE_URL: http://127.0.0.1:4321
          QA_ARTIFACT_ROOT: artifacts/ci
        run: |
          npm run preview -- --port 4321 > /tmp/turboj-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent "$QA_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:hero:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: website-evidence
          path: website/artifacts/ci
